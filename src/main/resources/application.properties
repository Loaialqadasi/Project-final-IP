spring.application.name=MindfulBytes
server.port=8080

# DATABASE CONFIG (H2 - Temporary for Dev)
spring.datasource.url=jdbc:h2:mem:mindfuldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console (to see data at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# THYMELEAF CONFIG (Hot reloading for HTML)
spring.thymeleaf.cache=false