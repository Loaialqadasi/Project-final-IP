<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: headContent}"></head>
<body style="background-color: #F8F9FA; font-family: 'Poppins', sans-serif;">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="d-flex">
    <!-- Admin Sidebar -->
    <div class="d-none d-md-block bg-white shadow-sm p-4" style="width: 250px; min-height: 100vh;">
        <div class="d-flex align-items-center mb-4">
            <div style="width: 40px; height: 40px; background-color: #F0F2F5; border-radius: 50%; margin-right: 10px;"></div>
            <div>
                <h6 class="fw-bold mb-0">Admin Name</h6>
                <small class="text-muted">Administrator</small>
            </div>
        </div>
        
        <!-- FIXED: Dashboard Link now points to the correct URL -->
        <a href="/admin/dashboard" class="d-flex align-items-center text-decoration-none mb-3 text-muted p-2">
            <span class="me-2">🎛️</span> Dashboard
        </a>
        <a href="#" class="d-flex align-items-center text-decoration-none mb-3 text-muted p-2">
            <span class="me-2">📓</span> Resources
        </a>
        <a href="/admin/users" class="d-flex align-items-center text-decoration-none mb-3 fw-bold p-2 rounded" style="background-color: #6BAA95; color: white;">
            <span class="me-2">👥</span> Manage Users
        </a>
    </div>

    <!-- Main Content -->
    <div class="container mt-5 px-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">User Management</h2>
            <!-- FIXED: Button now triggers the Modal -->
            <button class="btn text-white rounded-pill px-4" style="background-color: #6BAA95;" data-bs-toggle="modal" data-bs-target="#addUserModal">+ Add New User</button>
        </div>
        
        <!-- User Table Card -->
        <div class="card shadow-sm border-0" style="border-radius: 20px;">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead style="background-color: #F8F9FA;">
                        <tr class="text-muted text-uppercase small">
                            <th class="ps-4 py-3">User Name</th>
                            <th>User ID</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}" style="border-bottom: 1px solid #eee;">
                            <td class="ps-4 py-3 fw-bold" th:text="${user.name}"></td>
                            <td class="text-muted" th:text="${user.userId}"></td>
                            <td class="text-muted" th:text="${user.role}"></td>
                            
                            <td>
                                <span th:if="${user.status == 'Active'}" class="badge rounded-pill text-success" style="background-color: #E8F5E9; padding: 8px 12px;">Active</span>
                                <span th:if="${user.status == 'Banned'}" class="badge rounded-pill text-dark" style="background-color: #E0E0E0; padding: 8px 12px;">Inactive</span>
                            </td>

                            <td>
                                <div class="d-flex gap-2">
                                    <!-- FIXED: Removed Edit Button -->
                                    
                                    <form th:if="${user.status == 'Active'}" action="/admin/ban" method="post" style="display:inline;">
                                        <input type="hidden" name="userId" th:value="${user.userId}">
                                        <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold" style="background-color: #FFE0B2; color: #D35400;">Deactivate</button>
                                    </form>

                                    <form th:if="${user.status == 'Banned'}" action="/admin/unban" method="post" style="display:inline;">
                                        <input type="hidden" name="userId" th:value="${user.userId}">
                                        <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold" style="background-color: #C8E6C9; color: #2E7D32;">Activate</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- FIXED: Pagination simplified -->
            <div class="card-footer bg-white border-0 py-3">
                <div class="d-flex justify-content-center">
                    <span class="text-muted mx-2">&lt;</span>
                    <span class="fw-bold mx-2 text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; background-color: #6BAA95;">1</span>
                    <span class="text-muted mx-2">&gt;</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- NEW: Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form action="/admin/user/add" method="post">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="Student">Student</option>
                            <option value="Admin">Admin</option>
                            <option value="Counselor">Counselor</option>
                        </select>
                    </div>
                    <button type="submit" class="btn text-white w-100" style="background-color: #6BAA95;">Create User</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS needed for Modal -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
