

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: headContent}"></head>

<body class="bg-light">

    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <div class="text-center mb-5">
            <h2 class="fw-bold mb-3">Assessment Results</h2>
            <p class="text-muted">Here are your personalized feedback and recommendations based on your assessment.</p>
        </div>

        <div class="card shadow-sm p-4 mb-5">
            <h4 class="fw-bold">Your Score: <span th:text="${result.score}"></span></h4>
            <p class="mt-3" th:text="${result.feedback}"></p>
        </div>

        <div class="text-center">
            <a href="/assessment/download" class="btn btn-success rounded-pill px-4 py-2" download>
                <i class="fas fa-download"></i> Download Report
            </a>
            <a href="/history" class="btn btn-info rounded-pill px-4 py-2 ms-2">
                <i class="fas fa-history"></i> View History
            </a>
            <a href="/dashboard" class="btn btn-primary rounded-pill px-4 py-2 ms-2">
                <i class="fas fa-home"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
