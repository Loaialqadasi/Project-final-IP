<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History - MindfulBytes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .history-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .back-btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="history-container">
        <a href="/dashboard" class="btn btn-secondary back-btn">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        
        <h1><i class="fas fa-history"></i> Assessment History</h1>

        <div th:if="${#lists.isEmpty(history)}" class="no-data">
            <p>No assessment records found.</p>
            <a href="/assessment" class="btn btn-primary">Start New Assessment</a>
        </div>

        <div th:if="${!#lists.isEmpty(history)}">
            <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                <a href="/assessment" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> New Assessment
                </a>
                <a href="/assessment/download" class="btn btn-primary" download>
                    <i class="fas fa-download"></i> Download Full Report
                </a>
            </div>

            <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Assessment ID</th>
                        <th>Student ID</th>
                        <th>Score</th>
                        <th>Feedback</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="result : ${history}">
                        <td th:text="${result.id}"></td>
                        <td th:text="${result.studentId}"></td>
                        <td>
                            <span class="badge bg-primary" th:text="${result.score}"></span>
                        </td>
                        <td th:text="${#strings.abbreviate(result.feedback, 50)}"></td>
                        <td th:text="${#temporals.format(result.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/assessment/edit/{id}(id=${result.id})}" 
                                   class="btn btn-warning btn-sm">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a th:href="@{/assessment/delete/{id}(id=${result.id})}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this assessment?');">
                                    <i class="fas fa-trash"></i> Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
