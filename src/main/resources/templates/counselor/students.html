<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Students - Counselor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <div class="sidebar-logo">
            <div style="background-color: #A8E6CF; width: 40px; height: 40px; border-radius: 50%;"></div>
            <span>Mindful Bytes</span>
        </div>
        <div class="sidebar-menu">
            <a href="/counselor/dashboard">Dashboard</a>
            <a href="/counselor/appointments">Appointments</a>
            <a href="/counselor/profile">Profile</a>
            <a href="/counselor/forum">Forum</a>
        </div>
        <div class="consular-section">
            <small class="text-muted fw-bold">Consular</small>
            <a href="/counselor/students" class="assigned-btn active" style="display: block; text-decoration: none; color: #333;">My Assigned Students</a>
        </div>
        <div class="mt-auto">
            <a href="/counselor/settings" class="text-muted" style="text-decoration: none;"><i class="bi bi-gear"></i> Settings</a>
        </div>
    </div>

    <div class="main-content d-flex flex-column">
        <h4 class="fw-bold mb-4">My Assigned Students</h4>
        <div class="student-card mb-5">
            <div class="table-header-custom row mx-0">
                <div class="col-3">Student Name</div>
                <div class="col-3">Matric ID</div>
                <div class="col-3">Status</div>
                <div class="col-3 text-center">Actions</div>
            </div>
            <div th:each="student, iterStat : ${students}" 
                 th:class="${iterStat.odd}? 'student-row row-blue row mx-0' : 'student-row row-teal row mx-0'">
                <div class="col-3" th:text="${student.name}">Name</div>
                <div class="col-3" th:text="${student.matric}">Matric</div>
                <div class="col-3">
                    <span th:if="${student.status == 'High Risk'}" class="status-badge status-red">High Risk</span>
                    <span th:if="${student.status == 'Stable'}" class="status-badge status-light">Stable</span>
                    <span th:if="${student.status == 'Attention Needed'}" class="status-badge status-green">Attention Needed</span>
                </div>
                <div class="col-3 text-center">
                    <a href="/counselor/dashboard" class="btn btn-sm btn-primary rounded-pill">View Notes</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
